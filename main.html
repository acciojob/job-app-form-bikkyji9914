<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
	<h1>Job Application Form</h1>
	<form>
		<label for="name">Name:</label>
	<input type="text" id="name" required>
		<br>
		<br>
	<label for="email">Email:</label>
	<input type="Email" id="email" required>
		<br>
		<br>
		<label for="g-m">Gender:</label>
		<input type="radio" id="g-m" required name="gender">
		<label for="g-m">male</label>
		<input type="radio" id="g-f" required name="gender">
		<label for="g-f">female</label>
		<input type="radio" id="g-t" required name="gender">
		<label for="g-t">other</label>
		<br>
		<br>
		<label for="laptop">Laptop Brands:</label>
		<select id="laptop">
			<option>Apple</option>
			<option>Asus</option>
			<option>HP</option>
		</select>
		<br>
		<br>
		<label for="age">Age</label>
		<input type="number" id="age" required>
		<br>
		<br>
		<label for="dob">Date of Birth:</label>
		<input type="date" id="dob" required>
		<br>
		<br>
		<label for="password">Password</label>
		<input type="password" id="password" required>
		<br>
		<br>
		<label for="portfolio">Portfolio URL</label>
		<input type="url" id="portfolio">
		<br>
		<br>
		<button type="submit">Submit</button>
	</form>

</body>

</html>
