<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
	<h1>Job Application Form</h1>
<form method="post">

<label for="name">Name*</label>
<input type="text" id="name" name="name" required>

<br><br>

<label for="email">Email*</label>
<input type="email" id="email" name="email" required>

<br><br>

<label>Gender*</label>

<input type="radio" id="g-m" name="gender" value="male" required>
<label for="g-m">Male</label>

<input type="radio" id="g-f" name="gender" value="female" required>
<label for="g-f">Female</label>

<input type="radio" id="g-t" name="gender" value="other" required>
<label for="g-t">Other</label>

<br><br>

<label for="laptop">Laptop Brands:</label>
<select id="laptop" name="laptop">
<option>Apple</option>
<option>Asus</option>
<option>HP</option>
</select>

<br><br>

<label for="age">Age*</label>
<input type="number" id="age" name="age" required>

<br><br>

<label for="dob">Date of Birth*</label>
<input type="date" id="dob" name="dob" required>

<br><br>

<label for="password">Password*</label>
<input type="password" id="password" name="password" required>

<br><br>

<label for="portfolio">Portfolio URL</label>
<input type="url" id="portfolio" name="portfolio">

<br><br>

<button type="submit">Submit</button>

</form>

</body>

</html>
